[project]
name = "arb"
version = "0.1.0"
description = "Live scanner for sports betting arbitrage across bookmakers and betting exchanges"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["arb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
